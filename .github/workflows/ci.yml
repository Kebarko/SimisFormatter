# Checks every push to main and every pull request: type checking, linting, unit tests,
# integration tests in a downloaded VS Code, and packaging of the .vsix.
# The corpus check (npm run corpus) needs the MSTS files, which are copyrighted, so it runs only on a developer's computer.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows, where MSTS runs, and Linux, where Open Rails also runs.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # VS Code needs a display, which a Linux runner provides through a virtual X server.
      - name: Integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:vscode

      - name: Package
        if: runner.os == 'Linux'
        run: npm run package

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
